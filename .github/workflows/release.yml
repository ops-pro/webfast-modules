# A release of the modules: on a tag vX.Y.Z, the checks of CI once more on that commit, then a
# GitHub release whose notes are the version's section of CHANGELOG.md (a tag without one fails).
# Nothing is built or attested here: the binary that carries the modules is webfast's release,
# which pins the tag of this repository it was built with.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  release:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the release, with the version's section of CHANGELOG.md as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          printf '\n---\n\nThe crates `webfast-ngfw` and `webfast-challenge` at this tag; the binary that carries them is a webfast release.\n' >> notes.md
          gh release create "${{ github.ref_name }}" \
            --title "webfast-modules ${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag
