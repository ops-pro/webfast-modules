# Written by src/ftw.rs from its source (a rule's `examples`, a list of tests/corpus/): edit
# that, then `UPDATE_FTW_TESTS=1 cargo test -p webfast-ngfw --lib ftw`.
meta:
  author: "webfast"
  description: "Apache Struts 2 OGNL in the Content-Type (CVE-2017-5638)"
  enabled: true
  name: "wf-cve-2017-5638"
rule_id: 20170005638
tests:
  - test_id: 1
    desc: "wf-cve-2017-5638 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/upload.action"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
            "content-type": "%{#context}.multipart/form-data"
        output:
          log:
            expect_ids: [20170005638]
  - test_id: 2
    desc: "wf-cve-2017-5638 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/upload.action"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
            "content-type": "multipart/form-data; boundary=x"
        output:
          log:
            no_expect_ids: [20170005638]
