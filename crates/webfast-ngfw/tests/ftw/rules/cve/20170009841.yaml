# Written by src/ftw.rs from its source (a rule's `examples`, a list of tests/corpus/): edit
# that, then `UPDATE_FTW_TESTS=1 cargo test -p webfast-ngfw --lib ftw`.
meta:
  author: "webfast"
  description: "PHPUnit eval-stdin.php reached over HTTP (CVE-2017-9841)"
  enabled: true
  name: "wf-cve-2017-9841"
rule_id: 20170009841
tests:
  - test_id: 1
    desc: "wf-cve-2017-9841 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            expect_ids: [20170009841]
  - test_id: 2
    desc: "wf-cve-2017-9841 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/vendor/phpunit/phpunit/README.md"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            no_expect_ids: [20170009841]
