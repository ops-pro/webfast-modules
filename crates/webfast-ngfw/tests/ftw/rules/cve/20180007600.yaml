# Written by src/ftw.rs from its source (a rule's `examples`, a list of tests/corpus/): edit
# that, then `UPDATE_FTW_TESTS=1 cargo test -p webfast-ngfw --lib ftw`.
meta:
  author: "webfast"
  description: "Drupalgeddon2: a render array property as a parameter name (CVE-2018-7600)"
  enabled: true
  name: "wf-cve-2018-7600"
rule_id: 20180007600
tests:
  - test_id: 1
    desc: "wf-cve-2018-7600 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/user/register?mail%5B%23markup%5D=x"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            expect_ids: [20180007600]
  - test_id: 2
    desc: "wf-cve-2018-7600 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/user/register?mail=a%40b.test&name=x"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            no_expect_ids: [20180007600]
