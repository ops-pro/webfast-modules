# Written by src/ftw.rs from its source (a rule's `examples`, a list of tests/corpus/): edit
# that, then `UPDATE_FTW_TESTS=1 cargo test -p webfast-ngfw --lib ftw`.
meta:
  author: "webfast"
  description: "Fortinet FortiOS SSL VPN path traversal in fgt_lang (CVE-2018-13379)"
  enabled: true
  name: "wf-cve-2018-13379"
rule_id: 20180013379
tests:
  - test_id: 1
    desc: "wf-cve-2018-13379 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/remote/fgt_lang?lang=/../../../..//////////dev/cmdb/sslvpn_websession"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            expect_ids: [20180013379]
  - test_id: 2
    desc: "wf-cve-2018-13379 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/remote/fgt_lang?lang=en"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            no_expect_ids: [20180013379]
