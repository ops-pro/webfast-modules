meta:
  author: "webfast"
  description: "Spring Cloud Function routing expression header (CVE-2022-22963)"
  enabled: true
  name: "wf-cve-2022-22963"
rule_id: 20220022963
tests:
  - test_id: 1
    desc: "wf-cve-2022-22963 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/functionRouter"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
            "spring.cloud.function.routing-expression": "T(java.lang.String)"
        output:
          log:
            expect_ids: [20220022963]
  - test_id: 2
    desc: "wf-cve-2022-22963 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/functionRouter"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
            "content-type": "text/plain"
        output:
          log:
            no_expect_ids: [20220022963]
