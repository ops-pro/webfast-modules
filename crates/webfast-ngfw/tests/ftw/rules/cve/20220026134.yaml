meta:
  author: "webfast"
  description: "Atlassian Confluence OGNL injection in the path (CVE-2022-26134)"
  enabled: true
  name: "wf-cve-2022-26134"
rule_id: 20220026134
tests:
  - test_id: 1
    desc: "wf-cve-2022-26134 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/%24%7B%40java.lang.String%40valueOf(1)%7D/"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            expect_ids: [20220026134]
  - test_id: 2
    desc: "wf-cve-2022-26134 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/wiki/spaces/DOC/overview"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            no_expect_ids: [20220026134]
