# Written by src/ftw.rs from its source (a rule's `examples`, a list of tests/corpus/): edit
# that, then `UPDATE_FTW_TESTS=1 cargo test -p webfast-ngfw --lib ftw`.
meta:
  author: "webfast"
  description: "PAN-OS GlobalProtect SESSID cookie with a traversal or a command (CVE-2024-3400)"
  enabled: true
  name: "wf-cve-2024-3400"
rule_id: 20240003400
tests:
  - test_id: 1
    desc: "wf-cve-2024-3400 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/global-protect/login.esp"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
            "cookie": "SESSID=../../../x"
        output:
          log:
            expect_ids: [20240003400]
  - test_id: 2
    desc: "wf-cve-2024-3400 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/global-protect/login.esp"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
            "cookie": "SESSID=a1b2c3d4"
        output:
          log:
            no_expect_ids: [20240003400]
