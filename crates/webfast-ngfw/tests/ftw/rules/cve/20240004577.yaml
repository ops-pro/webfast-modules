# Written by src/ftw.rs from its source (a rule's `examples`, a list of tests/corpus/): edit
# that, then `UPDATE_FTW_TESTS=1 cargo test -p webfast-ngfw --lib ftw`.
meta:
  author: "webfast"
  description: "PHP-CGI argument injection through the query (CVE-2024-4577, CVE-2012-1823)"
  enabled: true
  name: "wf-cve-2024-4577"
rule_id: 20240004577
tests:
  - test_id: 1
    desc: "wf-cve-2024-4577 matches"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/index.php?%ADd+allow_url_include%3d1"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            expect_ids: [20240004577]
  - test_id: 2
    desc: "wf-cve-2024-4577 lets it be"
    stages:
      - description: "request"
        input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: "/index.php?d=1&mode=-d"
          version: "HTTP/1.1"
          headers:
            "host": "www.example.com"
        output:
          log:
            no_expect_ids: [20240004577]
